name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: notes
          POSTGRES_USER: notes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Django checks and tests against PostgreSQL
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: notes
          DB_USER: notes
          DB_PASSWORD: ci
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  images:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend (push on main)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/notes-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/notes-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend (push on main)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/notes-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/notes-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
