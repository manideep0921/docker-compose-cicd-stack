name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        working-directory: frontend
        run: npm ci && npm run lint
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (hashed lockfile)
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: notes
          POSTGRES_USER: notes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notes" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --require-hashes -r backend/requirements.txt
      - name: Django checks and tests against PostgreSQL
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: notes
          DB_USER: notes
          DB_PASSWORD: ci
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  # Proves the whole stack actually runs: db -> migrate (one-shot) -> backend -> frontend.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway .env
        run: |
          {
            echo "DB_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "HTTP_PORT=8080"
          } > .env
      - name: Build and start (waits for healthchecks)
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/notes
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
      - name: Migrate service ran once and exited 0
        run: |
          docker compose ps -a --format json migrate | grep -q '"ExitCode":0'
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    needs: [lint, dependency-audit, backend-test, frontend-test, compose-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: notes-backend
            context: backend
            build-args: ""
          - name: notes-frontend
            context: frontend
            build-args: GIT_SHA=${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign signing
      security-events: write # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build locally and scan BEFORE anything is pushed.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 2. On main: push with provenance + SBOM attestations, then sign by digest.
      - name: Push (main only)
        id: push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: Sign image (keyless, by digest)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.push.outputs.digest }}"
