# Hardening defaults shared by every service.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  init: true
  restart: unless-stopped

services:
  db:
    <<: *hardened
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Postgres' entrypoint needs these to chown/drop privileges; nothing else.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  # One-shot: applies migrations exactly once per `up`, so scaling the
  # backend never races several containers into `migrate` at the same time.
  migrate:
    <<: *hardened
    build: ./backend
    image: ${REGISTRY:-local}/notes-backend:${TAG:-dev}
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_HOST: db
      DB_NAME: notes
      DB_USER: notes
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *hardened
    build: ./backend
    image: ${REGISTRY:-local}/notes-backend:${TAG:-dev}
    environment: *backend-env
    read_only: true
    tmpfs:
      - /tmp
      - /dev/shm
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    <<: *hardened
    build:
      context: ./frontend
      args:
        GIT_SHA: ${TAG:-local}
    image: ${REGISTRY:-local}/notes-frontend:${TAG:-dev}
    ports:
      - "${HTTP_PORT:-8080}:80"
    # Nginx master binds :80 as root, then drops to the nginx user.
    cap_add: [NET_BIND_SERVICE, CHOWN, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

volumes:
  pgdata:
